name: Build MyTube CarPlay iOS IPA & TIPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -ld /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Build Tools (XcodeGen & ldid)
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive MyTube iOS App
        run: |
          xcodebuild archive \
            -project MyTube.xcodeproj \
            -scheme MyTube \
            -destination "generic/platform=iOS" \
            -archivePath build/MyTube.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Sign Entitlements & Package IPA / TIPA
        run: |
          mkdir -p build/Payload
          cp -R build/MyTube.xcarchive/Products/Applications/*.app build/Payload/
          
          APP_PATH=$(find build/Payload -name "*.app" -maxdepth 1)
          echo "Found app at: $APP_PATH"
          
          # Inject CarPlay and TrollStore entitlements with ldid
          APP_EXEC=$(find "$APP_PATH" -maxdepth 1 -type f -perm +111 | head -n 1)
          echo "Injecting entitlements into binary: $APP_EXEC"
          ldid -S"MyTube/MyTube.entitlements" "$APP_EXEC"
          
          cd build
          zip -r -q MyTube.ipa Payload
          cp MyTube.ipa MyTube.tipa
          cd ..
          
          ls -lh build/MyTube.ipa build/MyTube.tipa

      - name: Upload MyTube IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-CarPlay-IPA
          path: build/MyTube.ipa
          if-no-files-found: error

      - name: Upload MyTube TIPA (TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-CarPlay-TIPA
          path: build/MyTube.tipa
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-${{ github.run_number }}"
          gh release create "$TAG_NAME" build/MyTube.ipa build/MyTube.tipa \
            --title "My Tube v1.0.0 - Build #${{ github.run_number }} (CarPlay Full Video & TizenTube Experience)" \
            --notes "### 🚀 My Tube for iOS & Apple CarPlay (Phương Án A: Full Video Player)
- **Xem Video YouTube Toàn Màn Hình Trên Xe Ô Tô:** Hỗ trợ điều khiển cảm ứng trực tiếp trên màn hình taplo ô tô.
- **100% Chặn Quảng Cáo (AdBlock):** Tự động bỏ qua video ads pre-roll / mid-roll và xóa toàn bộ banner quảng cáo.
- **Tích Hợp SponsorBlock:** Tự động nhảy qua các đoạn quảng cáo tài trợ, intro kênh, lời nhắc đăng ký.
- **Bàn Phím Cảm Ứng Ô Tô:** Bàn phím ảo trực tiếp trên taplo để tìm kiếm bài hát, video mà không cần chạm điện thoại.
- **Âm Thanh Nền Không Gián Đoạn:** Âm thanh phát mượt mà qua loa ô tô khi tắt màn hình điện thoại hoặc khóa phím.
- **Cài Đặt:** Hỗ trợ cài qua **TrollStore** (file .tipa / .ipa) hoặc ký bằng chứng chỉ cá nhân/doanh nghiệp có hỗ trợ CarPlay (file .ipa qua Sideloadly / AltStore / Esign / Scarlet)."
